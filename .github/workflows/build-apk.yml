name: Build BSNL NOC APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3

      - name: Create Full Android Project
        run: |
          rm -rf app bsnl_sms_app
          mkdir -p app/src/main/java/com/bsnl/noc
          mkdir -p app/src/main/res/layout
          echo 'include ":app"' > settings.gradle
          
          cat > app/build.gradle <<'GRADLE'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.bsnl.noc'
            compileSdk 34
            defaultConfig {
              applicationId "com.bsnl.noc"
              minSdk 24
              targetSdk 34
              versionCode 2
              versionName "2.0"
            }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          GRADLE

          cat > app/src/main/AndroidManifest.xml <<'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.RECEIVE_SMS"/>
            <uses-permission android:name="android.permission.READ_SMS"/>
            <application android:label="BSNL NOC">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
              <receiver android:name=".SmsReceiver" android:exported="true">
                <intent-filter android:priority="1000"><action android:name="android.provider.Telephony.SMS_RECEIVE"/></intent-filter>
              </receiver>
            </application>
          </manifest>
          MANIFEST

          cat > app/src/main/java/com/bsnl/noc/MainActivity.kt <<'KT'
          package com.bsnl.noc
          import android.os.Bundle
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
            override fun onCreate(b: Bundle?) {
              super.onCreate(b)
              val count = getSharedPreferences("bsnl_noc", 0).all.size
              setContentView(TextView(this).apply { text = "BSNL NOC\nLIVE OPEN: $count sites\nYour 28 towers mapped" })
            }
          }
          KT

          cat > app/src/main/java/com/bsnl/noc/SmsReceiver.kt <<'KT'
          package com.bsnl.noc
          import android.content.*
          import android.provider.Telephony
          class SmsReceiver : BroadcastReceiver() {
            override fun onReceive(c: Context, i: Intent) {
              val msgs = Telephony.Sms.Intents.getMessagesFromIntent(i)
              for (m in msgs) {
                val body = m.displayMessageBody ?: ""
                val node = Regex("Node:\\s*([^,\\s]+)").find(body)?.groupValues?.get(1) ?: continue
                val state = Regex("State:\\s*([^,\\s]+)").find(body)?.groupValues?.get(1) ?: ""
                val prefs = c.getSharedPreferences("bsnl_noc", Context.MODE_PRIVATE)
                if (state.equals("Open", true)) prefs.edit().putString(node, node).apply() else prefs.edit().remove(node).apply()
              }
            }
          }
          KT

          cat > app/src/main/res/layout/activity_main.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:orientation="vertical" android:layout_width="match_parent" android:layout_height="match_parent"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="BSNL NOC"/></LinearLayout>
          XML

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BSNL-NOC-APK
          path: app/build/outputs/apk/debug/app-debug.apk
