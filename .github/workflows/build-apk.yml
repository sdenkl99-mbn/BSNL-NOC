name: Build BSNL NOC APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3

      - name: Clean old files and Create Project
        run: |
          rm -rf app bsnl_sms_app .gradle
          rm -f build.gradle
          cat > settings.gradle <<'EOF'
          include ":app"
          EOF
          cat > build.gradle <<'EOF'
          // empty root
          EOF
          mkdir -p app/src/main/java/com/bsnl/noc
          mkdir -p app/src/main/res/layout
          
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.2.0' apply false }
          plugins { id 'com.android.application' }
          android {
            namespace 'com.bsnl.noc'
            compileSdk 34
            defaultConfig {
              applicationId "com.bsnl.noc"
              minSdk 24
              targetSdk 34
              versionCode 3
              versionName "3.0"
            }
          }
          EOF
          
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.RECEIVE_SMS"/>
            <uses-permission android:name="android.permission.READ_SMS"/>
            <application android:label="BSNL NOC">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
              <receiver android:name=".SmsReceiver" android:exported="true">
                <intent-filter android:priority="1000"><action android:name="android.provider.Telephony.SMS_RECEIVE"/></intent-filter>
              </receiver>
            </application>
          </manifest>
          EOF
          
          cat > app/src/main/java/com/bsnl/noc/MainActivity.kt <<'EOF'
          package com.bsnl.noc
          import android.os.Bundle
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
            override fun onCreate(b: Bundle?) {
              super.onCreate(b)
              setContentView(TextView(this).apply { text = "BSNL NOC\nOPEN Sites: ${getSharedPreferences("bsnl_noc",0).all.size}\n28 towers mapped" })
            }
          }
          EOF
          
          cat > app/src/main/java/com/bsnl/noc/SmsReceiver.kt <<'EOF'
          package com.bsnl.noc
          import android.content.*
          import android.provider.Telephony
          class SmsReceiver : BroadcastReceiver() {
            override fun onReceive(c: Context, i: Intent) {
              val msgs = Telephony.Sms.Intents.getMessagesFromIntent(i)
              for (m in msgs) {
                val body = m.displayMessageBody ?: ""
                val node = Regex("Node:\\s*([^,\\s]+)").find(body)?.groupValues?.get(1) ?: continue
                val state = Regex("State:\\s*([^,\\s]+)").find(body)?.groupValues?.get(1) ?: ""
                val p = c.getSharedPreferences("bsnl_noc", 0)
                if (state.equals("Open", true)) p.edit().putString(node, node).apply() else p.edit().remove(node).apply()
              }
            }
          }
          EOF

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BSNL-NOC-APK
          path: app/build/outputs/apk/debug/app-debug.apk
