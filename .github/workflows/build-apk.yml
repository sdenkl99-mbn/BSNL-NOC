name: Build BSNL NOC APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3

      - name: Create Clean Project
        run: |
          rm -rf app bsnl_sms_app build .gradle
          rm -f build.gradle settings.gradle
          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          include ":app"
          EOF
          cat > build.gradle <<'EOF'
          // root empty
          EOF
          mkdir -p app/src/main/java/com/bsnl/noc
          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.2.2'
            id 'org.jetbrains.kotlin.android' version '1.9.22'
          }
          android {
            namespace 'com.bsnl.noc'
            compileSdk 34
            defaultConfig {
              applicationId "com.bsnl.noc"
              minSdk 24
              targetSdk 34
              versionCode 4
              versionName "4.0"
            }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'androidx.core:core-ktx:1.12.0'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.RECEIVE_SMS"/>
            <uses-permission android:name="android.permission.READ_SMS"/>
            <application android:label="BSNL NOC">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
              <receiver android:name=".SmsReceiver" android:exported="true">
                <intent-filter android:priority="1000"><action android:name="android.provider.Telephony.SMS_RECEIVE"/></intent-filter>
              </receiver>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/bsnl/noc/MainActivity.kt <<'EOF'
          package com.bsnl.noc
          import android.os.Bundle
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              val c = getSharedPreferences("bsnl_noc", 0).all.size
              setContentView(TextView(this).apply { text = "BSNL NOC\nOPEN: $c sites" })
            }
          }
          EOF
          cat > app/src/main/java/com/bsnl/noc/SmsReceiver.kt <<'EOF'
          package com.bsnl.noc
          import android.content.*
          import android.provider.Telephony
          class SmsReceiver : BroadcastReceiver() {
            override fun onReceive(c: Context, i: Intent) {
              for (m in Telephony.Sms.Intents.getMessagesFromIntent(i)) {
                val body = m.displayMessageBody ?: ""
                val node = Regex("Node:\\s*([^,\\s]+)").find(body)?.groupValues?.get(1) ?: continue
                val state = Regex("State:\\s*([^,\\s]+)").find(body)?.groupValues?.get(1) ?: ""
                val p = c.getSharedPreferences("bsnl_noc", 0)
                if (state.equals("Open", true)) p.edit().putString(node, node).apply() else p.edit().remove(node).apply()
              }
            }
          }
          EOF

      - name: Build APK
        run: gradle :app:assembleDebug --info

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BSNL-NOC-APK
          path: app/build/outputs/apk/debug/app-debug.apk
